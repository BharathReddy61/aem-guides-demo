<sly data-sly-use.model="com.adobe.aem.guides.demo.core.models.CarouselModel"/>

<div class="carousel-container">

    <div data-sly-test="${model.items.size > 0}"
         data-sly-list.item="${model.items}"
         class="carousel-item">

        <h2>${item.text}</h2>

        <p data-sly-test="${item.path}">
            <a href="${item.path}">View Details</a>
        </p>

        <ul data-sly-test="${item.nestedItems.size > 0}">
            <li data-sly-list.nested="${item.nestedItems}">
                ${nested.text}
            </li>
        </ul>

    </div>

    <p data-sly-test="${!model.items.size}">
        No Carousel items have been authored.
    </p>

</div>
